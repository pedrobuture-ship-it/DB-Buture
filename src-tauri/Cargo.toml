[package]
name = "db-buture"
version = "0.1.0"
description = "Visual Database Intelligence for Developers"
authors = ["Pedro Buture"]
edition = "2021"
publish = false

[lib]
name = "db_buture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json", "chrono", "macros"] }
sqlparser = "0.63.0"
petgraph = "0.8.3"
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native", "crypto-rust"] }
