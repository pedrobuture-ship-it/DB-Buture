[package]
name = "db-buture"
version = "0.1.0"
description = "Visual Database Intelligence for Developers"
authors = ["Pedro Buture"]
edition = "2021"
publish = false

[lib]
name = "db_buture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
